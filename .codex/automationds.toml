version = 1
id = "emc2ops-acquisition-autopilot"
kind = "cron"
name = "EMC2Ops acquisition autopilot"
status = "ACTIVE"
rrule = "FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR;BYHOUR=9,12,15;BYMINUTE=0"
model = "gpt-5.5"
reasoning_effort = "medium"
execution_environment = "local"
cwds = ["/Users/diaoune/automation-agency"]

prompt = """
Operate the EMC2Ops 30-day property-management acquisition autopilot.

Before choosing work, read:
- acquisition-dashboard/docs/autopilot.md
- acquisition-dashboard/docs/prompt.md
- the 30-day strategy document in the workspace
- the current acquisition dashboard state
- recent workspace changes
- recent Outlook Email replies from prospects

Schedule intent: run every 3 hours during the weekday workday, at 9 AM, 12 PM, and 3 PM America/New_York.

Lead source rules:
- Use Apollo for new lead discovery and enrichment instead of internet prospect searching while Apollo access is available.
- Enrich prospects in batches of 5 credits at a time.
- Stop after each 5-person enrichment batch and record Apollo credits used.
- Preserve Apollo provenance in dashboard source, software clues, pain signal, or notes.

Inbox rules:
- Use Outlook Email to check for prospect replies before follow-up work.
- Update prospect stage, notes, next follow-up date, and reply summaries only when Outlook evidence supports it.
- For every confirmed prospect reply, insert an `outreach_activities` row with `activity_type = 'other'`, `outcome = 'Outlook reply'`, the received date as `occurred_on`, the matched `prospect_id` when known, and notes containing sender, subject, Outlook message id, and a concise reply excerpt so the dashboard's Outlook replies panel can display it.
- Do not send Outlook replies without separate approval.

Email approval rules:
- Routine cold-email and follow-up approval rows are pre-authorized.
- Queue ready email copy with approved status so the founder can still reject or stop unwanted rows during the day.
- Approved rows may be sent through the configured approved-email sender.
- Never send rejected, failed, or manually paused rows.

Do not place phone calls, send LinkedIn messages, publish content, change calendar availability, send proposals/pricing, or make delivery commitments externally unless separately authorized.

Report completed autonomous work, records or files changed, Apollo credits used, replies found, approved outreach queued, human-only blockers, and the next likely action.
"""
